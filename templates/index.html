<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bharat Agrolink</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>🌾 Bharat Agrolink</h1>
        <p>Your Agriculture Marketplace</p>
    </header>

    <main>
        <h2>Available Products</h2>

        <select id="category" onchange="loadProducts()">
            <option value="All">All Categories</option>
            <option value="Seeds">Seeds</option>
            <option value="Fertilizers">Fertilizers</option>
        </select>

        <div id="products" class="products"></div>

        <h2>🛒 Shopping Cart</h2>
        <div id="cart"></div>

        <h2>Order Summary</h2>
        <div id="summary"></div>

        <button id="place-order-btn" type="button"
            onclick="localStorage.setItem('cart', JSON.stringify(cart)); window.location.href='/checkout';"
            style="margin-top: 15px; width: 100%; padding: 12px; background-color: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">
            Place Order
        </button>

        <div id="order-confirmation" style="margin-top: 15px;"></div>
    </main>

    <script src="/static/script.js"></script>
</body>

</html>
